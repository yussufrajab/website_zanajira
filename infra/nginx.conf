# ===========================================================
# Nginx Configuration — Tume ya Utumishi Serikalini
# ===========================================================
# Place this file at /etc/nginx/sites-available/zanajira.go.tz
# Then: sudo ln -s /etc/nginx/sites-available/zanajira.go.tz /etc/nginx/sites-enabled/
# ===========================================================

# Rate limiting zone for contact form
limit_req_zone $binary_remote_addr zone=contact:10m rate=3r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name zanajira.go.tz www.zanajira.go.tz;
    return 301 https://zanajira.go.tz$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zanajira.go.tz;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/zanajira.go.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zanajira.go.tz/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect www to non-www
    if ($host = www.zanajira.go.tz) {
        return 301 https://zanajira.go.tz$request_uri;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml text/javascript;

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js images optimization
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public";
    }

    # MinIO public assets (PDFs, images)
    location /assets/ {
        proxy_pass http://192.168.1.103:9000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache public assets
        expires 7d;
        add_header Cache-Control "public";
    }

    # Directus admin panel
    location /admin/ {
        proxy_pass http://192.168.1.102:8055/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Directus API
    location /api/ {
        proxy_pass http://192.168.1.102:8055/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Contact form rate limiting
    location /api/contact {
        limit_req zone=contact burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js application (all other routes)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}