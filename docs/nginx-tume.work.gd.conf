# ============================================================
# Nginx configuration for tume.work.gd
# ============================================================
# HOW TO APPLY:
# 1. Go to BT Panel > Website > tume.work.gd > Settings > Config
# 2. Replace the ENTIRE server { ... } block with this config
# 3. Keep the SSL certificate lines that BT Panel generates
# 4. Save and nginx will auto-reload
#
# ARCHITECTURE:
#   /admin/       → Directus CMS (port 8055) - admin panel
#   /auth/        → Directus CMS (port 8055) - authentication API
#   /server/      → Directus CMS (port 8055) - server info API
#   /assets/      → Directus CMS (port 8055) - uploaded files
#   /items/       → Directus CMS (port 8055) - data API
#   /extensions/  → Directus CMS (port 8055) - extensions API
#   /graphql      → Directus CMS (port 8055) - GraphQL endpoint
#   /websocket    → Directus CMS (port 8055) - realtime WebSocket
#   /files/       → Directus CMS (port 8055) - file management API
#   /users/       → Directus CMS (port 8055) - users API
#   /collections/ → Directus CMS (port 8055) - schema API
#   /fields/      → Directus CMS (port 8055) - fields API
#   /relations/   → Directus CMS (port 8055) - relations API
#   /roles/       → Directus CMS (port 8055) - roles API
#   /policies/    → Directus CMS (port 8055) - policies API
#   /presets/     → Directus CMS (port 8055) - presets API
#   /dashboards/  → Directus CMS (port 8055) - dashboards API
#   /panels/      → Directus CMS (port 8055) - panels API
#   /flows/       → Directus CMS (port 8055) - flows API
#   /operations/  → Directus CMS (port 8055) - operations API
#   /notifications/ → Directus CMS (port 8055) - notifications API
#   /activity/    → Directus CMS (port 8055) - activity API
#   /settings/    → Directus CMS (port 8055) - settings API
#   /webhooks/    → Directus CMS (port 8055) - webhooks API
#   /schema/      → Directus CMS (port 8055) - schema API
#   /search/      → Directus CMS (port 8055) - search API
#   /folders/     → Directus CMS (port 8055) - folders API
#   /revisions/   → Directus CMS (port 8055) - revisions API
#   /permissions/ → Directus CMS (port 8055) - permissions API
#   /shares/      → Directus CMS (port 8055) - shares API
#   /uploads/     → Directus CMS (port 8055) - uploads API
#   Everything else → Next.js frontend (port 3009)
# ============================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name tume.work.gd;

    # SSL certificates - BT Panel manages these, keep existing cert lines
    # ssl_certificate    /www/server/panel/vhost/cert/tume.work.gd/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/tume.work.gd/privkey.pem;

    # --- Common proxy settings for Directus ---
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ============================================================
    # Directus CMS routes
    # ============================================================

    # Admin panel (with PATH_PREFIX=/admin)
    location /admin {
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # All Directus API paths - proxy to Directus CMS
    # These are root-level API paths used by the Directus admin SPA
    location /auth/ {
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /server/ {
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /items/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /extensions/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /folders/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /users/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /collections/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /fields/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /relations/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /roles/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /policies/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /presets/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /dashboards/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /panels/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /flows/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /operations/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /notifications/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /activity/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /settings/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /webhooks/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /schema/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /search/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /revisions/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /permissions/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /shares/ {
        proxy_pass http://127.0.0.1:8055;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /graphql {
        proxy_pass http://127.0.0.1:8055;
    }

    location = /websocket {
        proxy_pass http://127.0.0.1:8055;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================================
    # Next.js Frontend (everything else)
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Access and error logs
    access_log  /www/wwwlogs/tume.work.gd.log;
    error_log   /www/wwwlogs/tume.work.gd.error.log;
}