# ============================================================
# Nginx configuration for tume.work.gd
# ============================================================
# HOW TO APPLY:
# 1. Go to BT Panel > Website > tume.work.gd > Settings > Config
# 2. Replace the ENTIRE server { ... } block with this config
# 3. Keep the SSL certificate lines that BT Panel generates
# 4. Save and nginx will auto-reload
#
# ARCHITECTURE (after Directus decommissioning):
#   All traffic — /admin/*, /api/*, /uploads/* and everything else —
#   is served by the Next.js frontend on port 3009. The Next.js app
#   provides the admin UI and JSON API directly (see
#   /docs/DIRECTUS_TO_NEXTJS_API_MIGRATION_PLAN.md).
# ============================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name tume.work.gd;

    # SSL certificates - BT Panel manages these, keep existing cert lines
    # ssl_certificate    /www/server/panel/vhost/cert/tume.work.gd/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/tume.work.gd/privkey.pem;

    # Client upload body size — allow PDF/image uploads through Next.js API.
    client_max_body_size 12m;

    # --- Common proxy settings ---
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ============================================================
    # Next.js application — serves public site, /admin/*, /api/*, /uploads/*
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Access and error logs
    access_log  /www/wwwlogs/tume.work.gd.log;
    error_log   /www/wwwlogs/tume.work.gd.error.log;
}